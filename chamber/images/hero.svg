<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Vista costera de Viña del Mar con el Reloj de Flores</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a5c8a"/>
      <stop offset="100%" stop-color="#003049"/>
    </linearGradient>
  </defs>

  <!-- Cielo -->
  <rect x="0" y="0" width="1200" height="500" fill="url(#sky)"/>

  <!-- Sol -->
  <circle cx="1030" cy="110" r="60" fill="#b45309" opacity="0.85"/>

  <!-- Skyline de edificios costeros -->
  <g fill="#8aa6b8" opacity="0.55">
    <rect x="60" y="200" width="50" height="140"/>
    <rect x="120" y="170" width="40" height="170"/>
    <rect x="170" y="215" width="55" height="125"/>
    <rect x="960" y="190" width="45" height="150"/>
    <rect x="1015" y="220" width="60" height="120"/>
    <rect x="1085" y="180" width="40" height="160"/>
  </g>

  <!-- Mar -->
  <rect x="0" y="300" width="1200" height="200" fill="url(#sea)"/>
  <path d="M0,300 Q150,280 300,300 T600,300 T900,300 T1200,300 V500 H0 Z" fill="#0a5c8a" opacity="0.5"/>

  <!-- Costa / arena -->
  <path d="M0,340 Q300,310 600,340 T1200,340 V500 H0 Z" fill="#e7d9b8"/>

  <!-- Palmeras -->
  <g>
    <rect x="148" y="300" width="8" height="70" fill="#5b3a21"/>
    <path d="M152,300 C120,280 100,290 90,270 C120,275 140,285 152,300 Z" fill="#2f6d4f"/>
    <path d="M152,300 C184,280 204,290 214,270 C184,275 164,285 152,300 Z" fill="#2f6d4f"/>
    <path d="M152,300 C140,265 150,250 140,230 C160,245 158,270 152,300 Z" fill="#2f6d4f"/>
  </g>
  <g>
    <rect x="1038" y="310" width="7" height="60" fill="#5b3a21"/>
    <path d="M1041,310 C1015,293 998,301 990,285 C1015,289 1030,297 1041,310 Z" fill="#2f6d4f"/>
    <path d="M1041,310 C1067,293 1084,301 1092,285 C1067,289 1052,297 1041,310 Z" fill="#2f6d4f"/>
    <path d="M1041,310 C1031,281 1039,268 1031,251 C1048,264 1046,285 1041,310 Z" fill="#2f6d4f"/>
  </g>

  <!-- Reloj de Flores -->
  <g transform="translate(600,400)">
    <circle r="85" fill="#4a7c3f"/>
    <circle r="85" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <g fill="#b45309">
      <circle cx="0" cy="-65" r="10"/>
      <circle cx="46" cy="-46" r="10"/>
      <circle cx="65" cy="0" r="10"/>
      <circle cx="46" cy="46" r="10"/>
      <circle cx="0" cy="65" r="10"/>
      <circle cx="-46" cy="46" r="10"/>
      <circle cx="-65" cy="0" r="10"/>
      <circle cx="-46" cy="-46" r="10"/>
    </g>
    <circle r="55" fill="#e7d9b8"/>
    <circle r="4" fill="#003049"/>
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#003049" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="25" y2="15" stroke="#003049" stroke-width="4" stroke-linecap="round"/>
  </g>

</svg>
